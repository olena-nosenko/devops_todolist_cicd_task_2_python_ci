name: python-deployment
run-name: "Workflow is triggering by ${{ github.actor }} user and ${{ github.sha }} commit hash"

env:
  PYTHON_VERSION: '3.8'
  
on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]

  workflow_dispatch:

jobs:
  python-ci:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./src

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ env.PYTHON_VERSION }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 coverage
        pip install -r requirements.txt

    - name: Check the code style with flake8
      run: |
        cd ../
        flake8 . --show-source --statistics

    - name: Check the complexity of the code with flake8
      run: |
        cd ../
        flake8 . --exit-zero --max-complexity=10 --statistics

    - name: Run tests with coverage
      run: coverage run manage.py test

    - name: Displays the coverage report in the console
      run: coverage report

    - name: Uploads Python code as an artifact
      uses: actions/upload-artifact@v4
      with:
        name: python-code-artifact
        path: .